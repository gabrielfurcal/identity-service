name: CI - .NET WebAPI Application

on: push

env:
  APP_NAME: identity-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0'

      - name: Extract version from .csproj
        id: version
        run: |
          VERSION=$(grep -oP '<Version>\K[^<]*' identity-service.csproj)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected app version: $VERSION"

      - name: Build with dotnet
        run: dotnet publish identity-service.csproj -c Release -o ./publish

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/$APP_NAME:$APP_VERSION .
          docker tag ${{ secrets.DOCKER_USERNAME }}/$APP_NAME:$APP_VERSION ${{ secrets.DOCKER_USERNAME }}/$APP_NAME:latest

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/$APP_NAME:$APP_VERSION
          docker push ${{ secrets.DOCKER_USERNAME }}/$APP_NAME:latest